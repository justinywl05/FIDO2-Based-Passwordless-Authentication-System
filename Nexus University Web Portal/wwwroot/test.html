<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passkey Registration Test</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="email"] { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.75rem 1.5rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        #logs { margin-top: 2rem; padding: 1rem; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; }
    </style>
</head>
<body>

    <h1>Register a Passkey</h1>
    
    <div class="form-group">
        <label for="email">User Email</label>
        <input type="email" id="email" placeholder="student@portal.edu" value="student@portal.edu">
    </div>
    <div class="form-group">
        <label for="deviceName">Device Name</label>
        <input type="text" id="deviceName" placeholder="e.g. Justin iPhone" value="My Test Device">
    </div>
    
    <button id="registerBtn">Register Passkey</button>

    <div id="logs">Ready...</div>

    <script>
        const log = (msg, data = null) => {
            const logsEl = document.getElementById('logs');
            let txt = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
            if (data) {
                txt += '\n' + JSON.stringify(data, null, 2);
            }
            logsEl.textContent = txt + '\n\n' + logsEl.textContent;
            console.log(msg, data);
        };

        // Utility functions to convert between Base64Url and ArrayBuffer
        function coerceToArrayBuffer(thing, name) {
            if (typeof thing === "string") {
                // base64url to base64
                thing = thing.replace(/-/g, "+").replace(/_/g, "/");
                // base64 to Uint8Array
                var str = window.atob(thing);
                var bytes = new Uint8Array(str.length);
                for (var i = 0; i < str.length; i++) {
                    bytes[i] = str.charCodeAt(i);
                }
                thing = bytes.buffer;
            }
            if (thing instanceof Uint8Array) {
                thing = thing.buffer;
            }
            if (!(thing instanceof ArrayBuffer)) {
                throw new TypeError("could not coerce '" + name + "' to ArrayBuffer");
            }
            return thing;
        }

        function coerceToBase64Url(thing) {
            if (thing instanceof ArrayBuffer) {
                thing = new Uint8Array(thing);
            }
            if (thing instanceof Uint8Array) {
                var str = "";
                var len = thing.byteLength;
                for (var i = 0; i < len; i++) {
                    str += String.fromCharCode(thing[i]);
                }
                thing = window.btoa(str);
            }
            if (typeof thing !== "string") {
                throw new Error("could not coerce to string");
            }
            // base64 to base64url
            thing = thing.replace(/\+/g, "-").replace(/\//g, "_").replace(/=*$/g, "");
            return thing;
        }

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const deviceName = document.getElementById('deviceName').value;
            
            try {
                log('1. Fetching registration options from backend...');
                const optionsRes = await fetch('/api/auth/register/options', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, deviceName, deviceType: 'Web' })
                });
                
                const optionsData = await optionsRes.json();
                if (optionsData.status !== 'ok') {
                    throw new Error(optionsData.errorMessage || 'Failed to get options');
                }
                
                log('Options received:', optionsData.options);
                
                const makeCredOptions = optionsData.options;
                
                // Decode necessary base64url fields to ArrayBuffer for WebAuthn API
                makeCredOptions.challenge = coerceToArrayBuffer(makeCredOptions.challenge);
                makeCredOptions.user.id = coerceToArrayBuffer(makeCredOptions.user.id);
                if (makeCredOptions.excludeCredentials) {
                    makeCredOptions.excludeCredentials.forEach(c => {
                        c.id = coerceToArrayBuffer(c.id);
                    });
                }
                
                log('2. Calling navigator.credentials.create()... (Waiting for user interaction)');
                const newCredential = await navigator.credentials.create({
                    publicKey: makeCredOptions
                });
                
                log('Credential created successfully! Transforming for backend...');
                
                // Encode ArrayBuffers back to base64url strings for the backend
                const attestationResponse = {
                    id: newCredential.id,
                    rawId: coerceToBase64Url(newCredential.rawId),
                    type: newCredential.type,
                    response: {
                        attestationObject: coerceToBase64Url(newCredential.response.attestationObject),
                        clientDataJSON: coerceToBase64Url(newCredential.response.clientDataJSON)
                    }
                };
                
                log('3. Sending attestation to backend for verification...');
                const verifyRes = await fetch('/api/auth/register/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        deviceName,
                        deviceType: 'Web',
                        attestationResponse: attestationResponse
                    })
                });
                
                const verifyData = await verifyRes.json();
                log('Verification Result:', verifyData);
                
                if (verifyData.success) {
                    alert('Success: ' + verifyData.message);
                } else {
                    alert('Failed: ' + verifyData.message);
                }
                
            } catch (err) {
                log('Error occurred:', err.message);
                console.error(err);
                alert('Error: ' + err.message);
            }
        });
    </script>
</body>
</html>
